services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: retail_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Karachi
    ports:
      - "5432:5432"
    volumes:
      - retail_pos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  retail_pos_postgres_data:
