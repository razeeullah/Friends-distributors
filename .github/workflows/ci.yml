name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retail_pos?schema=public
      AUTH_SESSION_TTL_HOURS: "12"
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: retail_pos, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d retail_pos" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run prisma:validate && npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run lint && npm run typecheck && npm run test
      - run: npm run build
